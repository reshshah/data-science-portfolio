name: uplift
random_state: 42

paths:
  data_dir: data/ml_uplift
  metadata_file: data/ml_uplift/feature_metadata.json
  output_dir: outputs

model:
  outcome_model: lightgbm
  n_estimators: 80
  num_leaves: 7
  max_depth: 3
  learning_rate: 0.05
  min_child_samples: 15

evaluation:
  n_buckets: 4

logging:
  level: INFO
  file: outputs/logs/train_uplift.log
