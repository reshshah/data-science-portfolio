name: churn_tuned
target: churn_label_180d
random_state: 42

paths:
  data_dir: data/ml
  metadata_file: data/ml/feature_metadata.json
  output_dir: outputs

# Starting point for the search -- only used for any hyperparameter NOT
# listed under tuning.param_distributions below (RandomizedSearchCV
# overrides whichever keys it searches over).
model:
  type: lightgbm
  n_estimators: 200
  num_leaves: 15
  max_depth: -1
  learning_rate: 0.05
  min_child_samples: 10
  class_weight: balanced

# Searched with RandomizedSearchCV + StratifiedKFold, scored on train only
# (validation/test stay held out for the final evaluation).
tuning:
  cv_folds: 5
  n_iter: 20
  scoring: roc_auc
  param_distributions:
    n_estimators: [100, 200, 300, 400]
    num_leaves: [7, 15, 31, 63]
    max_depth: [-1, 4, 6, 8]
    learning_rate: [0.01, 0.03, 0.05, 0.1]
    min_child_samples: [5, 10, 20, 40]

threshold:
  metric: f1
  search_min: 0.05
  search_max: 0.96
  search_step: 0.01

logging:
  level: INFO
  file: outputs/logs/tune_churn_lightgbm.log
